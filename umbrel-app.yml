manifestVersion: 1
id: monero-merchant
name: Monero Merchant
tagline: Accept Monero payments in your business
icon: https://raw.githubusercontent.com/Monero-Merchant/monero-merchant/main/icons/mm.png
category: Finance
version: "2.1.0"
port: 8080
description: >-
  Self-hosted POS system to accept Monero payments. Includes wallet, payment processing, admin dashboard, and Android POS app.
developer: Monero Merchant
website: https://moneromerchant.com
dependencies: []
repo: https://github.com/Monero-Merchant/monero-merchant
support: https://github.com/Monero-Merchant/monero-merchant/issues
gallery:
  - 1.jpg
  - 2.jpg
  - 3.jpg
releaseNotes: >-
  Native Umbrel 1.0+ app. One-click install with guided setup form, auto-generated secrets on first boot.
path: ""
defaultUsername: admin
defaultPassword: $APP_SEED
torOnly: false
permissions:
  - STORAGE_DOWNLOADS
submitter: Monero Merchant
submission: ""
userConfig:
  - id: MONERO_DAEMON_RPC_HOSTNAME
    name: Monero Daemon RPC Hostname
    description: "Public Monero node to sync against. Default: node.monero.world:18081"
    type: text
    default: node.monero.world
    required: true
  - id: MONERO_DAEMON_RPC_PORT
    name: Monero Daemon RPC Port
    description: "Default: 18081"
    type: number
    default: 18081
    required: true
  - id: ADMIN_PASSWORD
    name: Admin Password
    description: "Leave blank for auto-generated"
    type: password
    default: ""
    required: false
